name: Publish to PyPI

on:
  # Uncomment the push trigger below to enable automatic publishing to PyPI.
  # push:
  #   tags:
  #     - '[0-9]+.[0-9]+.[0-9]+'
  #     - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    container:   # we have to provide a working triqs installation to make the cmake step work
      image: flatironinstitute/triqs:${{github.ref_name}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build toml
        --user
    - name: prepare python distribution
      run: |
        mkdir build && cd build 
        cmake ../
        cp packaging/pypi/* ../
        mv python/triqs_dftkit/version.py ../python/triqs_dftkit/version.py
        rm ../python/triqs_dftkit/version.py.in
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v3
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish PyPI 🐍
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/triqs_dftkit
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v3
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true # skip if version name package already exists on pypi

